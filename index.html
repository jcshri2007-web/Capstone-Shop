<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' https: data:; connect-src https://fakestoreapi.com; style-src 'self'; script-src 'self'; base-uri 'none'">
  <meta name="description" content="Capstone Shop: an accessible, responsive storefront with simulated sign-in, a live product catalog, a cart, orders and an admin area.">
  <title>Capstone Shop</title>
  <link rel="stylesheet" href="style.css">
  <script src="js/ui.js" defer></script>
  <script src="js/api.js" defer></script>
  <script src="js/seed.js" defer></script>
  <script src="js/db.js" defer></script>
  <script src="js/auth.js" defer></script>
  <script src="js/services.js" defer></script>
  <script src="js/views/catalog.js" defer></script>
  <script src="js/views/cart.js" defer></script>
  <script src="js/views/orders.js" defer></script>
  <script src="js/views/admin.js" defer></script>
  <script src="js/views/account.js" defer></script>
  <script src="js/router.js" defer></script>
  <script src="js/app.js" defer></script>
</head>
<body>
  <a class="skip-link" href="#main">Skip to main content</a>
  <header class="site-header">
    <p class="brand"><a href="#/">Capstone Shop</a></p>
    <nav id="site-nav" aria-label="Primary"></nav>
  </header>

  <main id="main" tabindex="-1">
    <noscript><p class="banner">This store needs JavaScript to run.</p></noscript>
  </main>

  <footer class="site-footer">
    <p>Capstone project. Sign-in and checkout are simulated and nothing is charged.</p>
  </footer>

  <p id="announce" class="visually-hidden" role="status"></p>
  <div id="toasts" class="toasts"></div>
</body>
</html>
